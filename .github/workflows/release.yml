name: release

# Push a tag like v0.2.0. The tag must equal aegis.__version__.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag matches package version
        id: v
        run: |
          pkg=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('aegis/__init__.py').read())[1])")
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "tag $tag != package $pkg"; exit 1; }
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      - name: Changelog has an entry for this version
        run: grep -q "^## \[${{ steps.v.outputs.version }}\]" CHANGELOG.md

      - run: pip install build twine && python -m build && twine check --strict dist/*

      - name: Full test suite against the built wheel, not the source tree
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install --quiet dist/*.whl pytest
          # The pytest executable, not `python -m pytest`: -m would put the
          # checkout on sys.path and the tests would import the source tree.
          /tmp/v/bin/pytest -q -p no:cacheprovider --import-mode=importlib -o pythonpath= tests
          /tmp/v/bin/python -c "import aegis, sys; assert 'site-packages' in aegis.__file__, aegis.__file__"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

  pypi:
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token exists to leak. One-time setup is described in RELEASING.md.
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aegis-guard/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG
        run: |
          v="${{ needs.build.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aditya31398/aegis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/aditya31398/aegis
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
