# The smallest policy that ratifies: one read-only tool, bounded budgets.
name: quickstart
version: 1

tools:
  allow:
    - name: fs.read
      require_args: [path]
      args:
        path:
          prefix: "/workspace/"
          forbid_matches: '(?i)\.\.|%2e|%2f|%00|\x00|[\x00-\x1f]'
          max_len: 1024

budget:
  usd: 1.00
  tokens: 100000
  wall_clock_s: 300
  tool_calls: 50

data:
  max_classification: internal
  egress:
    sinks: []
    max_classification: public
